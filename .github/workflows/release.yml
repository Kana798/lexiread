name: Build Windows Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: '上传到哪个 Release tag'
        required: true
        default: 'v1.0.0'
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: 构建并发布 Windows 安装包
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run lint

      - name: Run tests
        run: npm test

      - name: Build frontend and server bundle
        run: npm run build

      # CI 环境下 electron-builder 会因检测到 CI 而隐式启用发布，进而要求 GH_TOKEN；
      # 这里显式禁用，发布统一交给下面的 gh release upload 步骤。
      - name: Package desktop app (NSIS + portable)
        run: npx electron-builder --win nsis portable --publish never --config.directories.output=release

      - name: Show produced installers
        shell: bash
        run: ls -lh release/*.exe

      - name: Publish installers to Release
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -e
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="$INPUT_TAG"
          else
            TAG="${GITHUB_REF_NAME}"
          fi
          echo "发布到 Release: $TAG"
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --title "LexiRead $TAG" --generate-notes
          gh release upload "$TAG" release/*.exe --clobber
          gh release view "$TAG" --json assets --jq '.assets[] | "\(.name)  \(.size) bytes"'

      - name: Upload installers as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: lexiread-windows-installers
          path: release/*.exe
          if-no-files-found: warn
          retention-days: 30
